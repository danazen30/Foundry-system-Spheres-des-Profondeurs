name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate system.json version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          MANIFEST_VERSION="$(node -pe "JSON.parse(require('fs').readFileSync('system.json','utf8')).version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($VERSION) does not match system.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Build archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="sdp-${VERSION}.zip"
          mkdir -p package/sdp
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'scripts' \
            --exclude '*.zip' \
            ./ package/sdp/
          (cd package && zip -r "../${ARCHIVE}" sdp)
          mv "${ARCHIVE}" "sdp-${VERSION}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdp-${{ steps.version.outputs.VERSION }}.zip
            system.json
          generate_release_notes: true
